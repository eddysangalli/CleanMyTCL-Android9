name: CI

# The tests that can run without a TV: the launcher's own unit tests, the debloat scripts'
# tests against a simulated TV, the package-name validation, and the link checker.
# The tests that need a real TV (the benchmark, the smoke test) are not here: they are in
# scripts/tcl-*.sh and need a device, so they stay a manual step before a release.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Build the release APK and run the unit tests
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --console=plain

      - name: Keep the release APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-release-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  scripts:
    name: debloat scripts and package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The debloat script tests (a simulated TV, no device needed)
        run: python -m unittest discover -s tests -v

      - name: The package-name validation
        run: bash tests/test_pkg_validate.sh

      - name: The shell scripts parse
        run: |
          for script in tools/disable.sh tools/restore.sh scripts/tcl-key-latency.sh \
                        scripts/tcl-compare-latency.py scripts/tcl-launcher-bench.sh; do
            case "$script" in
              *.py) python -m py_compile "$script" ;;
              *) bash -n "$script" ;;
            esac
          done

  links:
    name: links in the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the links
        run: python tools/check-links.py
