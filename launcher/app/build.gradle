plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Fork for the TCL BeyondTV2 (Android TV 9); own id so it never collides with upstream installs.
        applicationId 'br.eddy.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 11
        versionName '0.5'
    }

    buildTypes {
        release {
            // R8 drops the unused Kotlin stdlib that AndroidX pulls in: on the TCL a full `speed`
            // compile of the unshrunk APK took ~50 s and most of it was kotlin.* code we never call.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB only: the local debug key is enough, and it lets debug and release
            // builds replace each other with `adb install -r`.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
