distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
# The wrapper refuses a distribution whose bytes are not this one (#318, ported from upstream, which
# pins gradle-8.9 the same way). The pin is checked only when the zip is downloaded: an unpacked
# copy under GRADLE_USER_HOME\wrapper\dists carries an .ok marker and is used as is, so the local
# Gradle this fork is built and tested with keeps working without reaching services.gradle.org.
# Verify a version bump with https://services.gradle.org/distributions/gradle-<version>-bin.zip.sha256
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
